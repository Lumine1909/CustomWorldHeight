name: Bug report - General
about: Create a report to help us improve
title: "[BUG - General]"
labels: []
assignees: []
body:
- type: markdown
  attributes:
  value: |
  ## Describe the bug
  A clear and concise description of what the bug is.

- type: textarea
  id: reproduction_steps
  attributes:
  label: To Reproduce
  description: Steps to reproduce the behavior.
  placeholder: |
  1. Go to '...'
  2. Click on '....'
  3. Scroll down to '....'
  4. See error
  validations:
  required: true

- type: textarea
  id: expected_behavior
  attributes:
  label: Expected behavior
  description: A clear and concise description of what you expected to happen.
  validations:
  required: true

- type: textarea
  id: error_log
  attributes:
  label: Error log (if exists)
  description: Please use mclo.gs if it is too long.
  validations:
  required: false

- type: textarea
  id: screenshots
  attributes:
  label: Screenshots
  description: If applicable, add screenshots to help explain your problem.
  validations:
  required: false

- type: input
  id: server_version
  attributes:
  label: Server brand and version
  placeholder: e.g. paper-1.21.11-132
  validations:
  required: true

- type: textarea
  id: additional_context
  attributes:
  label: Additional context
  description: Add any other context about the problem here.
  validations:
  required: false
