name: Feature request
description: Suggest an idea for this project
title: ""
labels: []

body:
- type: textarea
  id: problem
  attributes:
  label: Is your feature request related to a problem?
  description: Describe the problem you're trying to solve.
  placeholder: |
  A clear and concise description of what the problem is.
  Example: I'm always frustrated when [...]
  validations:
  required: true

- type: textarea
  id: solution
  attributes:
  label: Describe the solution you'd like
  description: Describe what you want to happen.
  placeholder: A clear and concise description of the desired solution.
  validations:
  required: true

- type: textarea
  id: alternatives
  attributes:
  label: Describe alternatives you've considered
  description: Describe any alternative solutions or features you've considered.
  placeholder: A clear and concise description of any alternatives you've thought about.
  validations:
  required: false

- type: textarea
  id: additional-context
  attributes:
  label: Additional context
  description: Add any other context, screenshots, or mockups about the feature request here.
  placeholder: Include anything else that may help explain your idea.
  validations:
  required: false